<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Stage 0 bootstrap: CSV to GCS to BigQuery</title>
  <desc id="dsc">Animated fan-out diagram of the csv_to_bigquery_improved Airflow DAG: a local file preflight check, then parallel bucket and dataset creation, then six independent TaskGroups that upload, load and verify each of the six CSV tables into BigQuery.</desc>

  <style>
    svg {
      --ink:#0f172a; --mut:#64748b; --faint:#94a3b8;
      --line:#cbd5e1; --card:#ffffff; --soft:#f8fafc; --band:#f1f5f9;
      --gcp:#1d4ed8; --gcp-bg:#eff6ff; --gcp-ln:#4285F4;
      --ok:#15803d; --ok-bg:#f0fdf4; --ok-ln:#22c55e;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#e2e8f0; --mut:#94a3b8; --faint:#64748b;
        --line:#334155; --card:#0f172a; --soft:#111c2e; --band:#0b1220;
        --gcp:#93c5fd; --gcp-bg:#0a1524; --gcp-ln:#1d4ed8;
        --ok:#4ade80; --ok-bg:#04140a; --ok-ln:#15803d;
      }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ttl { font-size: 24px; font-weight: 700; fill: var(--ink); }
    .sub { font-size: 13px; fill: var(--mut); }
    .kick { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; fill: var(--mut); }
    .h2 { font-size: 15px; font-weight: 700; fill: var(--ink); }
    .h3 { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
    .body { font-size: 11.5px; fill: var(--mut); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: var(--mut); }
    .m9 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; fill: var(--mut); }
    .col-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: var(--ink); }
    .dash { stroke-dasharray: 5 5; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -10; } }
    @keyframes pop { 0% { transform: scale(.82); opacity:.5 } 60% { transform: scale(1.05); opacity:1 } 100% { transform: scale(1); opacity:1 } }
    .pop { animation: pop 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <text class="ttl" x="20" y="40">Stage 0 — bootstrap the raw layer from six CSVs</text>
  <text class="sub" x="20" y="62">DAG <tspan font-family="ui-monospace,Menlo,monospace">csv_to_bigquery_improved</tspan> · manual trigger only · retries 2 · max_active_runs 1</text>

  <!-- ======== STEP 1 : PREFLIGHT ======== -->
  <g>
    <rect x="20" y="96" width="360" height="122" rx="12" fill="var(--card)" stroke="var(--ok)" stroke-width="1.5"/>
    <rect x="20" y="96" width="360" height="4" rx="2" fill="var(--ok)"/>
    <text class="kick" x="36" y="124" fill="var(--ok)">STEP 1 · FAIL FAST</text>
    <text class="h2" x="36" y="146">check_local_files</text>
    <text class="body" x="36" y="165">fails fast: all six CSVs must be on disk</text>
    <g class="mono">
      <g transform="translate(36,180)">
        <rect x="0" y="0" width="98" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="6" y="12" fill="var(--ok)">customers 2 000</text>
        <rect x="104" y="0" width="80" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="110" y="12" fill="var(--ok)">stores 25</text>
        <rect x="190" y="0" width="92" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="196" y="12" fill="var(--ok)">products 500</text>
        <rect x="0" y="20" width="104" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="6" y="32" fill="var(--ok)">employees 250</text>
        <rect x="110" y="20" width="90" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="116" y="32" fill="var(--ok)">orders 10 000</text>
        <rect x="206" y="20" width="118" height="16" rx="4" fill="var(--ok-bg)" stroke="var(--ok-ln)"/><text x="212" y="32" fill="var(--ok)">order_items 30 021</text>
      </g>
    </g>
  </g>

  <!-- ======== STEP 2 : PROVISION (parallel) ======== -->
  <g>
    <rect x="420" y="96" width="340" height="122" rx="12" fill="var(--card)" stroke="var(--gcp-ln)" stroke-width="1.5"/>
    <rect x="420" y="96" width="340" height="4" rx="2" fill="var(--gcp-ln)"/>
    <text class="kick" x="436" y="124" fill="var(--gcp)">STEP 2A · IN PARALLEL</text>
    <text class="h2" x="436" y="146">create_bucket</text>
    <text class="mono" x="436" y="168">gs://walmart-dataset1 · us-east1</text>
    <text class="body" x="436" y="188">an existing bucket is logged, not an error</text>
    <text class="m9" x="436" y="206">storage class STANDARD · idempotent</text>
  </g>
  <g>
    <rect x="800" y="96" width="380" height="122" rx="12" fill="var(--card)" stroke="var(--gcp-ln)" stroke-width="1.5"/>
    <rect x="800" y="96" width="380" height="4" rx="2" fill="var(--gcp-ln)"/>
    <text class="kick" x="816" y="124" fill="var(--gcp)">STEP 2B · IN PARALLEL</text>
    <text class="h2" x="816" y="146">create_dataset</text>
    <text class="mono" x="816" y="168">walmart_db · location US · exists_ok</text>
    <text class="body" x="816" y="188">US multi-region reads any US bucket</text>
    <text class="m9" x="816" y="206">runs in parallel with create_bucket</text>
  </g>

  <!-- edges from preflight -->
  <g stroke="var(--line)" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M382 150 H 414"/>
    <path d="M762 150 H 794"/>
  </g>
  <circle cx="382" cy="150" r="3.5" fill="var(--gcp)">
    <animate attributeName="cx" values="384;412" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ======== DISTRIBUTION RAILS ======== -->
  <g stroke="var(--line)" stroke-width="2" fill="none" class="dash">
    <path d="M590 218 V 248 H 115"/>
    <path d="M590 248 H 1085"/>
    <path d="M990 218 V 346 H 115"/>
    <path d="M990 346 H 1085"/>
  </g>
  <g fill="var(--gcp)">
    <circle r="3.5">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#railA" href="#railA"/></animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="1.7s"><mpath xlink:href="#railB" href="#railB"/></animateMotion>
    </circle>
  </g>
  <path id="railA" d="M590 218 V 248 H 240" fill="none" stroke="none"/>
  <path id="railB" d="M990 218 V 346 H 240" fill="none" stroke="none"/>

  <!-- ======== STEP 3 : SIX PARALLEL TASK GROUPS ======== -->
  <text class="kick" x="20" y="240" fill="var(--mut)">STEP 3 · SIX INDEPENDENT TASKGROUPS · UPLOAD &#8594; LOAD &#8594; VERIFY</text>

  <!-- column helper: x positions 26,220,414,608,802,996 ; width 178 -->
  <g>
    <g>
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">customers</text>
      <text class="m9" x="38" y="305">upload → raw/customers.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
    <g transform="translate(194,0)">
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">stores</text>
      <text class="m9" x="38" y="305">upload → raw/stores.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" begin="0.15s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="0.65s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1.15s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
    <g transform="translate(388,0)">
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">products</text>
      <text class="m9" x="38" y="305">upload → raw/products.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
    <g transform="translate(582,0)">
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">employees</text>
      <text class="m9" x="38" y="305">upload → raw/employees.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="0.95s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1.45s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
    <g transform="translate(776,0)">
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">orders</text>
      <text class="m9" x="38" y="305">upload → raw/orders.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
    <g transform="translate(970,0)">
      <rect x="26" y="266" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="286">order_items</text>
      <text class="m9" x="38" y="305">upload → raw/order_items.csv</text>
      <rect x="26" y="364" width="178" height="56" rx="10" fill="var(--card)" stroke="var(--gcp-ln)"/>
      <text class="col-t" x="38" y="384">load</text>
      <text class="m9" x="38" y="403">WRITE_TRUNCATE</text>
      <rect x="26" y="466" width="178" height="44" rx="10" fill="var(--ok-bg)" stroke="var(--ok-ln)"/>
      <text class="mono" x="38" y="486" fill="var(--ok)">check_not_empty</text>
      <text class="m9" x="38" y="502" fill="var(--faint)">COUNT(*) &gt; 0</text>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="252;266" dur="1s" begin="0.75s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--gcp)"><animate attributeName="cy" values="330;364" dur="1s" begin="1.25s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="0" r="3.5" fill="var(--ok)"><animate attributeName="cy" values="430;466" dur="1s" begin="1.75s" repeatCount="indefinite"/></circle>
      <circle cx="115" cy="466" r="4" fill="none" stroke="var(--ok)" stroke-width="2" class="pop"/>
    </g>
  </g>

  <!-- vertical connectors inside columns -->
  <g stroke="var(--line)" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M115 322 V 358"/><path d="M309 322 V 358"/><path d="M503 322 V 358"/>
    <path d="M697 322 V 358"/><path d="M891 322 V 358"/><path d="M1085 322 V 358"/>
    <path d="M115 420 V 460"/><path d="M309 420 V 460"/><path d="M503 420 V 460"/>
    <path d="M697 420 V 460"/><path d="M891 420 V 460"/><path d="M1085 420 V 460"/>
  </g>

  <!-- ======== NOTES ======== -->
  <g transform="translate(20,536)">
    <rect x="0" y="0" width="1160" height="152" rx="12" fill="var(--soft)" stroke="var(--line)"/>
    <text class="h3" x="18" y="26">Design decisions worth knowing</text>
    <text class="body" x="18" y="48">The Python <tspan font-family="ui-monospace,Menlo,monospace">SCHEMAS</tspan> dict is the single source of truth. Each load job creates its own table with <tspan font-family="ui-monospace,Menlo,monospace">CREATE_IF_NEEDED</tspan>, so there is</text>
    <text class="body" x="18" y="66">no separate DDL file to keep in sync. Column types, <tspan font-family="ui-monospace,Menlo,monospace">STRING</tspan> lengths and <tspan font-family="ui-monospace,Menlo,monospace">NUMERIC</tspan> precision are all declared in one place.</text>
    <text class="body" x="18" y="90"><tspan font-family="ui-monospace,Menlo,monospace">WRITE_TRUNCATE</tspan> plus <tspan font-family="ui-monospace,Menlo,monospace">max_active_runs=1</tspan> make reruns safe: the table is replaced, never appended to. <tspan font-family="ui-monospace,Menlo,monospace">deferrable=True</tspan> releases the worker slot while BigQuery runs the load.</text>
    <text class="body" x="18" y="114"><tspan font-family="ui-monospace,Menlo,monospace">check_not_empty</tspan> catches the quiet failure where a load reports success but the table ends up empty. <tspan font-family="ui-monospace,Menlo,monospace">COUNT(*) = 0</tspan> is falsy, so the check fails loudly</text>
    <text class="body" x="18" y="132">instead of shipping an empty table downstream.</text>
  </g>
</svg>
